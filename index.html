<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Skincare Intelligence | AI/ML Market Analytics & Recommender</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
    <!-- Stlite CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.73.0/build/stlite.css" />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0F1117;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #root {
        width: 100%;
        height: 100vh;
      }
      /* Custom Loading Screen Overlay */
      #stlite-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, #0f1117 0%, #171b26 50%, #0f1117 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: #e2e8f0;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(244, 114, 182, 0.2);
        border-top: 4px solid #ec4899;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .loading-title {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(90deg, #f472b6, #c084fc, #60a5fa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
      }
      .loading-sub {
        color: #94a3b8;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div id="stlite-loading">
      <div class="spinner"></div>
      <div class="loading-title">Skincare Intelligence AI</div>
      <div class="loading-sub" style="text-align:center; max-width: 450px; line-height: 1.5; margin-top: 5px;">
        Downloading Python Engine, Scikit-Learn & ML Models into your browser...<br>
        <span style="font-size: 0.85rem; color: #64748b;">(First load takes ~30–45s to download WebAssembly packages. Subsequent visits will load instantly from browser cache!)</span>
      </div>
    </div>
    <div id="root"></div>

    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.73.0/build/stlite.js";

      mount(
        {
          requirements: [
            "pandas",
            "numpy",
            "scikit-learn",
            "plotly"
          ],
          entrypoint: "app.py",
          files: {
            "app.py": {
              url: "./app.py",
            },
            "ml_pipeline.py": {
              url: "./ml_pipeline.py",
            },
            "cosmetics_clean.csv": {
              url: "./cosmetics_clean.csv",
            }
          },
          streamlitConfig: {
            "theme.primaryColor": "#EC4899",
            "theme.backgroundColor": "#0F1117",
            "theme.secondaryBackgroundColor": "#1E293B",
            "theme.textColor": "#E2E8F0",
            "server.headless": true
          }
        },
        document.getElementById("root")
      ).then(() => {
        const loadingEl = document.getElementById("stlite-loading");
        if (loadingEl) {
          loadingEl.style.opacity = "0";
          loadingEl.style.visibility = "hidden";
          setTimeout(() => loadingEl.remove(), 500);
        }
      });
    </script>
  </body>
</html>
